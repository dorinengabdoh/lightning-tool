[package]
name = "lightning-tool"
version = "0.1.0"
edition = "2021"
authors = ["Student Developer"]
description = "Lightning SatGate - Terminal de Paiement Lightning, Décodeur BOLT11 & Nœud LDK en Rust"

[dependencies]
# Bitcoin & Lightning Domain Crates
lightning-invoice = "0.30.0"
bitcoin = "0.30.0"
secp256k1 = "0.27.0"
ldk-node = "0.7.0"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dotenvy = "0.15"

# Async & Networking
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Security
zeroize = { version = "1.7", features = ["derive"] }

# CLI Output & Formatting
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
colored = "2.1"
indicatif = "0.17"

# Utilities
chrono = "0.4"
hex = "0.4"
